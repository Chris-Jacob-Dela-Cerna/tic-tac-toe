<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
  </head>

  <body>
    <main class="tictactoe__panel">
      <div class="tictactoe__header">
        <div class="tictactoe__symbols">
          <img class="tictactoe__symbol" src="" alt="">
          <img class="tictactoe__symbol" src="" alt="">
          <img class="tictactoe__symbol" src="" alt="">
        </div>
        <button class="tictactoe__restart-btn">
          <img class="tictactoe__restart-icon" src="" alt="">
        </button>
      </div>

      <div class="gameboard"></div>

      <div class="scoreboard">
        <div class="scoreboard__x"></div>
        <div class="scoreboard__tie"></div>
        <div class="scoreboard__o"></div>
      </div>
    </main>
  </body>
</html>
