<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
  </head>

  <body>
    <main class="tictactoe__panel">
      <div class="tictactoe__header">
        <div class="tictactoe__symbols">
          <img class="tictactoe__symbol" src="icons/x-teal.svg" alt="X Symbol">
          <img class="tictactoe__symbol " src="icons/circle-yellow-orange.svg" alt="O Symbol">
          <img class="tictactoe__symbol" src="icons/x-teal.svg" alt="X Symbol">
        </div>
        <button class="tictactoe__restart-btn">
          <img class="tictactoe__restart-icon" src="icons/restart-dark-blue.svg" alt="Restart Icon">
        </button>
      </div>

      <div class="gameboard"></div>

      <div class="tictactoe__scoreboard">
        <div class="tictactoe__score bg-teal">
          <p class="tictactoe__score-label">( X )</p>
          <p class="tictactoe__score-points">0</p>
        </div>
        <div class="tictactoe__score bg-grey">
          <p class="tictactoe__score-label">TIES</p>
          <p class="tictactoe__score-points">0</p>
        </div>
        <div class="tictactoe__score bg-yellow-orange">
          <p class="tictactoe__score-label">( O )</p>
          <p class="tictactoe__score-points">0</p>
        </div>
      </div>
    </main>
  </body>
</html>
